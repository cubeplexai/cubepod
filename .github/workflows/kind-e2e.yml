name: Kind E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kind-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLUSTER_NAME: cubepod-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACTS: ${{ github.workspace }}/.kind-e2e/artifacts
      KEEP_CLUSTER: "0"
      GOMAXPROCS: "2"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install pinned Rust and cluster tools
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
          bash test/kind-e2e/install-tools.sh
          echo "$GITHUB_WORKSPACE/.kind-e2e/tools" >> "$GITHUB_PATH"
      - name: Build, deploy and run both official SDKs
        run: |
          mkdir -p "$ARTIFACTS"
          set -o pipefail
          make test-kind-e2e 2>&1 | tee "$ARTIFACTS/run.log"
      - name: Clean up owned cluster (also after cancellation)
        if: always()
        run: |
          if [[ -f ".kind-e2e/$CLUSTER_NAME/owned" ]]; then
            bash test/kind-e2e/run.sh down
          fi
      - name: Upload reports and cluster diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .kind-e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
