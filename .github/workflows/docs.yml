name: Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-docs:
    name: Build & Verify Documentation Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Verify release notes renderer and current changelog
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_release_notes.py'
          version=$(sed -nE 's/^version: ([^ ]+)$/\1/p' deploy/helm/cubepod/Chart.yaml | head -1)
          python3 scripts/release-notes.py "v${version}" >/dev/null

      - name: Build Astro + Starlight site and llms.txt
        working-directory: website
        run: npm run build

      - name: Verify build artifacts & internal links
        working-directory: website
        run: npm run verify

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubepod-docs-dist
          path: website/dist
          retention-days: 7

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-docs]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: cubepod-docs-dist
          path: website/dist

      - name: Resolve Cloudflare Pages project
        id: resolve
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          token = os.environ["CF_API_TOKEN"]
          account_id = os.environ["CF_ACCOUNT_ID"]
          projects = []
          page = 1
          while True:
              url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects?page={page}&per_page=50"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              if not payload.get("success"):
                  print("Cloudflare API error:", payload.get("errors"), file=sys.stderr)
                  sys.exit(1)
              batch = payload.get("result") or []
              projects.extend(batch)
              info = payload.get("result_info") or {}
              if not batch or page >= int(info.get("total_pages") or 1):
                  break
              page += 1

          print("Available Pages projects:")
          target = None
          for p in projects:
              name = p.get("name", "")
              domains = p.get("domains") or []
              print(f"  - {name}: {domains}")
              if "cubepod.cubeplex.ai" in domains:
                  target = name

          if not target:
              for candidate in ("cubepod-docs", "cubepod", "cubepod-website"):
                  if any(p.get("name") == candidate for p in projects):
                      target = candidate
                      break

          if not target:
              print("No Pages project matches domain cubepod.cubeplex.ai or cubepod-docs/cubepod.", file=sys.stderr)
              sys.exit(1)

          print(f"Resolved Pages project: {target}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"project_name={target}\n")
          PY

      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=${{ steps.resolve.outputs.project_name }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Note skipped deployment when credentials are absent
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare Pages secrets (CF_API_TOKEN/CF_ACCOUNT_ID or CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID) are not configured; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
