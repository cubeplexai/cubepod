name: Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-docs:
    name: Build & Verify Documentation Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Verify release notes renderer and current changelog
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_release_notes.py'
          version=$(sed -nE 's/^version: ([^ ]+)$/\1/p' deploy/helm/cubepod/Chart.yaml | head -1)
          python3 scripts/release-notes.py "v${version}" >/dev/null

      - name: Build Astro + Starlight site and llms.txt
        working-directory: website
        run: npm run build

      - name: Verify build artifacts & internal links
        working-directory: website
        run: npm run verify

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubepod-docs-dist
          path: website/dist
          retention-days: 7

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build-docs]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: cubepod-docs-dist
          path: website/dist

      - name: Ensure Cloudflare Pages project exists
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.error, urllib.request
          token = os.environ["CF_API_TOKEN"]
          account_id = os.environ["CF_ACCOUNT_ID"]
          project = "cubepod-docs"

          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project}",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
              print(f"Found Pages project '{project}' (domains: {data.get('result', {}).get('domains')})")
              sys.exit(0)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  print(f"Cloudflare API HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')}", file=sys.stderr)
                  sys.exit(1)

          print(f"Creating Cloudflare Pages project '{project}'...")
          create_req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects",
              data=json.dumps({"name": project, "production_branch": "main"}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(create_req, timeout=20) as resp:
                  created = json.loads(resp.read().decode("utf-8"))
              print(f"Created Pages project '{project}' (subdomain: {created.get('result', {}).get('subdomain')})")
          except urllib.error.HTTPError as exc:
              print(f"Failed to create Pages project HTTP {exc.code}: {exc.read().decode('utf-8', 'replace')}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=cubepod-docs --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Note skipped deployment when credentials are absent
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare Pages secrets (CF_API_TOKEN/CF_ACCOUNT_ID or CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID) are not configured; skipping deployment." >> "$GITHUB_STEP_SUMMARY"
