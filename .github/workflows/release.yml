name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    name: Build and Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build all binaries
        run: |
          make build
          ls -la bin/

      - name: Package release assets
        id: package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCH="linux-amd64"
          DIST_DIR="dist"
          mkdir -p ${DIST_DIR}

          for binary in podd-init podd cubepod-controller cubepod-gateway cubepod-egress; do
            if [ -f "bin/${binary}" ]; then
              cp "bin/${binary}" "${DIST_DIR}/${binary}-${TAG_NAME}-${ARCH}"
            fi
          done

          # Create a unified tarball
          tar -czf "${DIST_DIR}/cubepod-${TAG_NAME}-${ARCH}.tar.gz" -C bin .

          # Generate SHA256 checksums
          cd ${DIST_DIR}
          sha256sum * > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "${TAG_NAME}" dist/* \
            --title "CubePod Release ${TAG_NAME}" \
            --notes "Release ${TAG_NAME} compiled binaries for linux-amd64." || true

  publish-images:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    needs: [release-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cubepod-podd
            dockerfile: images/podd/Dockerfile
            context: .
          - image: cubepod-controller
            dockerfile: images/controller/Dockerfile
            context: .
          - image: cubepod-gateway
            dockerfile: images/gateway/Dockerfile
            context: .
          - image: cubepod-egress
            dockerfile: images/egress/Dockerfile
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
