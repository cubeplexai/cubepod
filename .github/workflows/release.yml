name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag (e.g. v0.4.0) to re-run release for'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  release-binaries:
    name: Build and Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build all binaries
        run: |
          make build
          ls -la bin/

      - name: Package release assets
        id: package
        run: |
          TAG_NAME="${RELEASE_TAG}"
          ARCH="linux-amd64"
          DIST_DIR="dist"
          mkdir -p ${DIST_DIR}

          for binary in podd-init podd cubepod-controller cubepod-gateway cubepod-egress cubepod; do
            if [ -f "bin/${binary}" ]; then
              cp "bin/${binary}" "${DIST_DIR}/${binary}-${TAG_NAME}-${ARCH}"
            fi
          done

          # Create a unified tarball
          tar -czf "${DIST_DIR}/cubepod-${TAG_NAME}-${ARCH}.tar.gz" -C bin .

          # Build Python SDK wheel & sdist
          python -m pip install --upgrade pip build
          python -m build sdks/python --outdir "${DIST_DIR}"

          # Pack TypeScript SDK tarball
          npm pack ./sdks/typescript --pack-destination "${DIST_DIR}"

          # Generate SHA256 checksums
          cd ${DIST_DIR}
          sha256sum * > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${RELEASE_TAG}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* \
              --title "CubePod Release ${TAG_NAME}" \
              --generate-notes
          fi

  build-python-sdk:
    name: Build Python SDK (sdist & wheel)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python SDK distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build sdks/python --outdir python-dist

      - name: Upload Python SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python-dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish Python SDK to TestPyPI
    needs: [build-python-sdk]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download Python SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to TestPyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Python SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-npm:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Run TypeScript SDK unit tests
        working-directory: sdks/typescript
        run: npm test

      - name: Publish to npm (OIDC Trusted Publishing or NPM_TOKEN bootstrap)
        working-directory: sdks/typescript
        env:
          NPM_Bootstrap_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VER} already exists on npm, skipping."
            exit 0
          fi
          if [ -n "${NPM_Bootstrap_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_Bootstrap_TOKEN}"
          fi
          npm publish --provenance --access public

  publish-images:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    needs: [release-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cubepod-podd
            dockerfile: images/podd/Dockerfile
            context: .
          - image: cubepod-controller
            dockerfile: images/controller/Dockerfile
            context: .
          - image: cubepod-gateway
            dockerfile: images/gateway/Dockerfile
            context: .
          - image: cubepod-egress
            dockerfile: images/egress/Dockerfile
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
