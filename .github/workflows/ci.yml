name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  rust-ci:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test
        run: cargo test --workspace

  go-ci:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Go Format Check
        run: |
          diffs=$(gofmt -s -l .)
          if [ -n "$diffs" ]; then
            echo "Unformatted Go files found:"
            echo "$diffs"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Unit Tests
        run: go test -v -race ./pkg/... ./cmd/... ./api/...

  python-ci:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx>=0.27.0

      - name: Run Python SDK Unit Tests
        run: python3 -m unittest discover -s sdks/python/tests

      - name: Run Release Script Tests
        run: python3 -m unittest discover -s scripts/tests

  typescript-ci:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run TypeScript SDK Unit Tests
        working-directory: sdks/typescript
        run: npm test

  helm-ci:
    name: Helm Chart Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint deploy/helm/cubepod

      - name: Helm Template Verification
        run: helm template cubepod-ci deploy/helm/cubepod

      - name: Panel secret chart and entrypoint regressions
        run: |
          python3 deploy/helm/test_panel_secret.py -v
          python3 deploy/docker-compose/test_entrypoint.py -v

  e2e-suite:
    name: Full E2E Integration Suite
    runs-on: ubuntu-latest
    needs: [rust-ci, go-ci, python-ci, typescript-ci, helm-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx>=0.27.0

      - name: Run End-to-End Tests
        run: make test-e2e

  e2b-compat-ci:
    name: E2B SDK Compatibility Suite
    runs-on: ubuntu-latest
    needs: [go-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Pull base test image
        run: docker pull busybox:latest

      - name: Run Official E2B SDK Compatibility Suite
        run: make test-e2b-compat

  e2b-compat-ts-ci:
    name: E2B TypeScript SDK Compatibility Suite
    runs-on: ubuntu-latest
    needs: [go-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Official E2B TypeScript SDK Compatibility Suite
        run: make test-e2b-compat-ts
