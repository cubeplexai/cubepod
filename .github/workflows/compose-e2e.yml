name: Compose E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose-e2e:
    name: Compose / official SDK E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: cubepod-compose-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACTS: ${{ github.workspace }}/.compose-e2e/artifacts
      GOMAXPROCS: "2"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Install pinned Rust and Compose
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
          mkdir -p "$RUNNER_TEMP/compose-tools"
          curl -fsSL --retry 3 --max-time 120 https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 -o "$RUNNER_TEMP/compose-tools/docker-compose"
          echo "7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4  $RUNNER_TEMP/compose-tools/docker-compose" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/compose-tools/docker-compose"
          echo "COMPOSE_BIN=$RUNNER_TEMP/compose-tools/docker-compose" >> "$GITHUB_ENV"
      - name: Build real Compose deployment and run both official SDKs
        run: |
          mkdir -p "$ARTIFACTS"
          set -o pipefail
          make test-compose-e2e 2>&1 | tee "$ARTIFACTS/run.log"
      - name: Clean up only this invocation's owned project
        if: always()
        run: |
          if [[ -f ".compose-e2e/$COMPOSE_PROJECT_NAME/owned" ]]; then
            bash test/compose-e2e/run.sh down
          fi
      - name: Upload reports and deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .compose-e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
