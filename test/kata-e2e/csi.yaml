# Single-node, disposable-cluster CSI dependency. Never install in a shared cluster.
apiVersion: v1
kind: Namespace
metadata: {name: cubepod-csi}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: hostpath, namespace: cubepod-csi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cubepod-e2e-hostpath}
rules:
- apiGroups: [""]
  resources: [nodes, persistentvolumes, persistentvolumeclaims, pods, events]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses, csinodes, volumeattachments, volumeattachments/status, volumeattributesclasses]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cubepod-e2e-hostpath}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cubepod-e2e-hostpath}
subjects: [{kind: ServiceAccount, name: hostpath, namespace: cubepod-csi}]
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata: {name: hostpath.csi.k8s.io}
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: File
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: cubepod-block}
provisioner: hostpath.csi.k8s.io
# The example driver forgets DeleteVolume metadata before asynchronous
# NodeUnpublishVolume, returning NotFound and leaking published block binds.
# Retain the test backing files until proven unpublish + scoped loop cleanup;
# deleting this owned kind node then removes files/PVs, not a production policy.
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: hostpath, namespace: cubepod-csi}
spec:
  serviceName: hostpath
  replicas: 1
  selector: {matchLabels: {app: cubepod-e2e-csi}}
  template:
    metadata: {labels: {app: cubepod-e2e-csi}}
    spec:
      serviceAccountName: hostpath
      tolerations: [{operator: Exists}]
      containers:
      - name: driver
        image: registry.k8s.io/sig-storage/hostpathplugin:v1.18.0
        args: [--drivername=hostpath.csi.k8s.io, --v=5, --endpoint=unix:///csi/csi.sock, "--nodeid=$(NODE)"]
        env:
        - name: NODE
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        securityContext: {privileged: true}
        volumeMounts:
        - {name: socket, mountPath: /csi}
        - {name: data, mountPath: /csi-data-dir}
        - {name: devices, mountPath: /dev}
        - {name: pods, mountPath: /var/lib/kubelet/pods, mountPropagation: Bidirectional}
        - {name: plugins, mountPath: /var/lib/kubelet/plugins, mountPropagation: Bidirectional}
      - name: registrar
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
        args: [--v=3, --csi-address=/csi/csi.sock, --kubelet-registration-path=/var/lib/kubelet/plugins/cubepod-e2e-hostpath/csi.sock]
        volumeMounts:
        - {name: socket, mountPath: /csi}
        - {name: registry, mountPath: /registration}
      - name: provisioner
        image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0
        args: [--v=3, --csi-address=/csi/csi.sock, --timeout=60s, --retry-interval-start=1s]
        volumeMounts: [{name: socket, mountPath: /csi}]
      volumes:
      - name: socket
        hostPath: {path: /var/lib/kubelet/plugins/cubepod-e2e-hostpath, type: DirectoryOrCreate}
      - name: plugins
        hostPath: {path: /var/lib/kubelet/plugins, type: Directory}
      - name: registry
        hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
      - name: data
        hostPath: {path: /var/lib/cubepod-kata-e2e/CLUSTER_PLACEHOLDER/csi, type: DirectoryOrCreate}
      - name: devices
        hostPath: {path: /dev, type: Directory}
      - name: pods
        hostPath: {path: /var/lib/kubelet/pods, type: Directory}
