[project]
name = "cubepod"
version = "0.3.0"
description = "Async-first Python SDK for CubePod (E2B-compatible persistent MicroVM sandboxes)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "e2b>=2.0.0",
    "e2b-code-interpreter>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
