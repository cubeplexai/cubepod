[project]
name = "cubepod"
version = "0.4.0"
description = "Async-first Python SDK for CubePod (E2B-compatible persistent MicroVM sandboxes)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "CubePlex Maintainers" }]
requires-python = ">=3.11"
keywords = ["cubepod", "e2b", "sandbox", "microvm", "ai-agents", "kata-containers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://cubepod.cubeplex.ai"
Documentation = "https://cubepod.cubeplex.ai/getting-started/introduction/"
Repository = "https://github.com/cubeplexai/cubepod"
Issues = "https://github.com/cubeplexai/cubepod/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "e2b>=2.0.0",
    "e2b-code-interpreter>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubepod"]
