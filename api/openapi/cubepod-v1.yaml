openapi: 3.1.0
info:
  title: CubePod Canonical API (E2B-Compatible Superset)
  version: 0.3.0
  description: |
    Unified Control & Data Plane API for CubePod.
    - 100% wire-compatible with E2B Control Plane (`/sandboxes`) and Data Plane (`podd` on `:49983`).
    - Extends E2B with dual-block-volume persistence (`rootfs` + `workspace`), 1s CoW `fork`,
      stateless background command `cursor` logs, Server-Sent Events (SSE) command streaming,
      atomic `archive-sync` for Skills, zero-trust `cbxref_` egress secret bindings,
      signed HTTP/WS/WebRTC panel proxying, and pre-warmed Kata MicroVM pools (`/warmpools`).

paths:
  /health:
    get:
      summary: Health check of the Gateway and cluster state
      operationId: getHealth
      responses:
        "200":
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "cubepod-gateway"
                  sandboxes:
                    type: integer
                  autoResumeCount:
                    type: integer

  /openapi.yaml:
    get:
      summary: Retrieve the OpenAPI 3.1 specification for CubePod
      operationId: getOpenAPISpec
      responses:
        "200":
          description: OpenAPI specification file
          content:
            application/yaml:
              schema:
                type: string

  /sandboxes:
    post:
      summary: Create or claim a CubePod sandbox (E2B compatible + CubePod extensions)
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: Sandbox created and ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"
    get:
      summary: List all sandboxes with optional state and template filters
      operationId: listSandboxes
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [Running, Paused, Provisioning, Failed, Terminated]
        - name: templateID
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of sandboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxInfo"

  /sandboxes/{sandboxID}:
    get:
      summary: Get sandbox status and endpoints
      operationId: getSandbox
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"
        "404":
          description: Sandbox not found
    delete:
      summary: Kill and delete sandbox
      operationId: deleteSandbox
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: deleteVolumes
          in: query
          description: Whether to delete persistent RootFS and Workspace PVCs
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Sandbox deleted successfully

  /sandboxes/{sandboxID}/pause:
    post:
      summary: Suspend sandbox (flush filesystem, delete MicroVM pod, retain RootFS & Workspace Block PVCs)
      operationId: pauseSandbox
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sandbox paused (0 CPU/RAM consumed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"

  /sandboxes/{sandboxID}/connect:
    post:
      summary: Connect to sandbox, automatically resuming from Paused state if needed (E2B compatible)
      operationId: connectSandbox
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sandbox is running and ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"

  /sandboxes/{sandboxID}/timeout:
    post:
      summary: Set sandbox idle timeout
      operationId: setTimeoutSandbox
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeoutSeconds:
                  type: integer
                  example: 1800
      responses:
        "200":
          description: Timeout updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"

  /sandboxes/{sandboxID}/lease:
    post:
      summary: Acquire or renew lease protection against automatic idle pausing
      operationId: setLeaseSandbox
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                leaseSeconds:
                  type: integer
                  example: 300
      responses:
        "200":
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"

  /sandboxes/{sandboxID}/reset-rootfs:
    post:
      summary: Reset the persistent RootFS Upper PVC to a clean Base Image state while preserving /workspace
      operationId: resetRootfs
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: RootFS reset complete, /workspace intact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"

  /sandboxes/{sandboxID}/fork:
    post:
      summary: Clone an existing sandbox in ~1s via CSI Copy-on-Write block snapshots
      operationId: forkSandbox
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                volumeKey:
                  type: string
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          description: Forked sandbox ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxInfo"

  /sandboxes/{sandboxID}/commands/run:
    post:
      summary: Execute command in sandbox (foreground synchronous or background asynchronous)
      operationId: runCommand
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCommandRequest"
      responses:
        "200":
          description: Command execution result or background process metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"

  /sandboxes/{sandboxID}/commands/{cmdID}/logs:
    get:
      summary: Read incremental command logs via stateless byte-offset cursor
      operationId: getCommandLogs
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: cmdID
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Command log slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandLogsResponse"

  /sandboxes/{sandboxID}/commands/{cmdID}/status:
    get:
      summary: Inspect background command process status, PID, exit code, and log cursor
      operationId: getCommandStatus
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: cmdID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandStatusResponse"
        "404":
          description: Command not found

  /sandboxes/{sandboxID}/commands/{cmdID}/stream:
    get:
      summary: Stream incremental command logs over Server-Sent Events (SSE text/event-stream) until completion
      operationId: streamCommandLogs
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: cmdID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream of command log frames
          content:
            text/event-stream:
              schema:
                type: string
                example: "data: {\"id\":\"cmd-1\",\"content\":\"hello\\n\",\"cursor\":6,\"running\":false,\"exit_code\":0}\n\n"

  /sandboxes/{sandboxID}/commands/{cmdID}/kill:
    post:
      summary: Send SIGKILL to the command process group (-pgid)
      operationId: killCommand
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: cmdID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command killed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  killed:
                    type: boolean

  /sandboxes/{sandboxID}/files:
    get:
      summary: Read file content from sandbox
      operationId: getFile
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [raw, json]
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  content:
                    type: string
                  size:
                    type: integer
        "404":
          description: File not found
    put:
      summary: Upload file to sandbox with optional UID/GID and mode settings
      operationId: putFile
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          schema:
            type: string
        - name: uid
          in: query
          required: false
          schema:
            type: integer
            default: 1000
        - name: gid
          in: query
          required: false
          schema:
            type: integer
            default: 1000
        - name: mode
          in: query
          required: false
          schema:
            type: string
            default: "0644"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                content:
                  type: string
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  path:
                    type: string
                  size:
                    type: integer
    delete:
      summary: Delete file or directory from sandbox workspace
      operationId: deleteFile
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  deleted:
                    type: string
        "404":
          description: File not found

  /sandboxes/{sandboxID}/files/list:
    get:
      summary: List files and directories in sandbox workspace
      operationId: listFiles
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          schema:
            type: string
            default: "/workspace"
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
        "404":
          description: Directory not found

  /sandboxes/{sandboxID}/files/archive-sync:
    post:
      summary: Synchronize skill archives (tar.gz) into sandbox memory/filesystem
      operationId: archiveSync
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: destination
          in: query
          required: false
          schema:
            type: string
            default: "/workspace"
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              format: binary
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Archive unpacked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  extracted:
                    type: integer

  /sandboxes/{sandboxID}/endpoints/{port}:
    post:
      summary: Mint HMAC-SHA256 signed panel proxy token for interactive web/VNC/HTTP ports
      operationId: mintEndpointToken
      parameters:
        - name: sandboxID
          in: path
          required: true
          schema:
            type: string
        - name: port
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInSeconds:
                  type: integer
                  default: 3600
                targetUrl:
                  type: string
      responses:
        "200":
          description: Signed proxy URL and token
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time

  /panel/{token}:
    get:
      summary: Reverse-proxy HTTP/WebSocket/WebRTC traffic into sandbox port using signed token
      operationId: proxyPanel
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proxy response from sandbox port

  /internal/v1/egress/exchange:
    post:
      summary: Swap zero-trust cbxref_ reference tokens for real external API credentials
      operationId: egressExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                host:
                  type: string
      responses:
        "200":
          description: Real secret returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string

  /warmpools:
    post:
      summary: Register and scale a pre-warmed Kata MicroVM standby pool
      operationId: createWarmPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarmPoolRequest"
      responses:
        "201":
          description: Warm pool reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarmPoolInfo"
    get:
      summary: List all active warm standby pools and total ready count
      operationId: listWarmPools
      responses:
        "200":
          description: Warm pool status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarmPoolsListResponse"

  /templates:
    get:
      summary: List available sandbox templates and runtime blueprints
      operationId: listTemplates
      responses:
        "200":
          description: Available sandbox templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateInfo"

components:
  schemas:
    CreateSandboxRequest:
      type: object
      properties:
        templateID:
          type: string
          default: "cubeplex-ubuntu24-desktop"
        timeout:
          type: integer
          default: 1800
        metadata:
          type: object
          additionalProperties:
            type: string
        envVars:
          type: object
          additionalProperties:
            type: string
        extension:
          type: object
          description: CubePod enterprise extensions
          properties:
            volumeKey:
              type: string
              description: Deterministic persistent storage key (e.g. ws-01-user-99)
            rootfsSize:
              type: string
              default: "10Gi"
            workspaceSize:
              type: string
              default: "20Gi"
            networkPolicy:
              type: object
              properties:
                defaultAction:
                  type: string
                  enum: [Allow, Deny]
                allowHosts:
                  type: array
                  items:
                    type: string
                upstreamProxy:
                  type: string
                secretBindings:
                  type: array
                  items:
                    type: object
                    properties:
                      envName:
                        type: string
                      placeholder:
                        type: string
                      allowedHosts:
                        type: array
                        items:
                          type: string

    SandboxInfo:
      type: object
      required:
        - sandboxID
        - templateID
        - state
      properties:
        sandboxID:
          type: string
        templateID:
          type: string
        state:
          type: string
          enum: [Running, Paused, Provisioning, Pausing, Resuming, Failed, Terminated]
        envdPort:
          type: integer
          default: 49983
        poddURL:
          type: string
        rootfsGeneration:
          type: integer
          default: 1
        volumeKey:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        timeoutSeconds:
          type: integer
        leaseSeconds:
          type: integer
        autoResumeCount:
          type: integer

    RunCommandRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          example: "echo hello"
        cmd:
          type: string
        workdir:
          type: string
          default: "/workspace"
        envs:
          type: object
          additionalProperties:
            type: string
        background:
          type: boolean
          default: false

    CommandResponse:
      type: object
      properties:
        id:
          type: string
        cmdID:
          type: string
        running:
          type: boolean
        pid:
          type: integer
        exitCode:
          type: integer
        stdout:
          type: string
        stderr:
          type: string

    CommandLogsResponse:
      type: object
      properties:
        id:
          type: string
        cmdID:
          type: string
        content:
          type: string
        cursor:
          type: integer
        running:
          type: boolean
        exitCode:
          type: integer

    CommandStatusResponse:
      type: object
      properties:
        id:
          type: string
        cmdID:
          type: string
        pid:
          type: integer
        running:
          type: boolean
        exit_code:
          type: integer
        exitCode:
          type: integer
        cursor:
          type: integer

    FileListResponse:
      type: object
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
              is_dir:
                type: boolean
              size:
                type: integer
              mode:
                type: string

    CreateWarmPoolRequest:
      type: object
      properties:
        name:
          type: string
          default: "default-pool"
        templateRef:
          type: string
          default: "cubeplex-ubuntu24-desktop"
        replicas:
          type: integer
          default: 2

    WarmPoolInfo:
      type: object
      properties:
        name:
          type: string
        poolName:
          type: string
        templateRef:
          type: string
        replicas:
          type: integer
        readyReplicas:
          type: integer
        availableReplicas:
          type: integer

    WarmPoolsListResponse:
      type: object
      properties:
        warmPools:
          type: array
          items:
            $ref: "#/components/schemas/WarmPoolInfo"
        warmPoolReadyCount:
          type: integer
        totalReady:
          type: integer

    TemplateInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        description:
          type: string
