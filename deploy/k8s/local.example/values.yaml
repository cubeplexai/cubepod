global:
  imageRegistry: "registry.example.com"
  repository: "cubepod"
  imagePullSecrets:
    - "regcred"

runtime:
  runtimeClassName: "kata-clh"
  poddInjectorImage: "registry.example.com/cubepod/cubepod-podd:v0.8.0"
  defaultSandboxImage: "registry.example.com/cubepod/sandbox:latest"
  templatePullSecret: "regcred"

storage:
  storageClassName: "longhorn-v2-block-thin"
  volumeMode: "Block"

gateway:
  replicaCount: 1
  image:
    registry: "registry.example.com"
    repository: "cubepod/cubepod-gateway"
    tag: "v0.8.0"
    pullPolicy: "IfNotPresent"
  service:
    type: "NodePort"
    port: 8080
    nodePort: 32380
  livePodRouting: true

controller:
  replicaCount: 1
  image:
    registry: "registry.example.com"
    repository: "cubepod/cubepod-controller"
    tag: "v0.8.0"
    pullPolicy: "IfNotPresent"
  workloadNamespace: "cubepod-workloads"

egress:
  enabled: true
  image:
    registry: "registry.example.com"
    repository: "cubepod/cubepod-egress"
    tag: "v0.8.0"
  caSecretName: "cubepod-egress-ca"
  upstreamCAEnabled: true

featureGates:
  e2bTemplateAPI: true
