---
apiVersion: v1
kind: Namespace
metadata:
  name: cubepod-system
  labels:
    app.kubernetes.io/name: cubepod
    app.kubernetes.io/part-of: cubepod

---
apiVersion: v1
kind: Namespace
metadata:
  name: cubepod-workloads
  labels:
    app.kubernetes.io/name: cubepod
    app.kubernetes.io/part-of: cubepod

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podboxes.cubepod.io
spec:
  group: cubepod.io
  names:
    plural: podboxes
    singular: podbox
    kind: PodBox
    shortNames:
      - pbox
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podtemplates.cubepod.io
spec:
  group: cubepod.io
  names:
    plural: podtemplates
    singular: podtemplate
    kind: PodTemplate
    shortNames:
      - ptpl
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podwarmpools.cubepod.io
spec:
  group: cubepod.io
  names:
    plural: podwarmpools
    singular: podwarmpool
    kind: PodWarmPool
    shortNames:
      - pwp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubepod-admin
  namespace: cubepod-system
imagePullSecrets:
  - name: regcred
  - name: hub.sensedeal.vip

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cubepod-system
imagePullSecrets:
  - name: regcred
  - name: hub.sensedeal.vip

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cubepod-workloads
imagePullSecrets:
  - name: regcred
  - name: hub.sensedeal.vip

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cubepod-admin
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - pods/exec
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - services
      - endpoints
      - configmaps
      - secrets
      - namespaces
      - events
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["*"]
  - apiGroups:
      - "cubepod.io"
      - "pod.cubeplex.ai"
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cubepod-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cubepod-admin
subjects:
  - kind: ServiceAccount
    name: cubepod-admin
    namespace: cubepod-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubepod-controller
  namespace: cubepod-system
  labels:
    app: cubepod-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cubepod-controller
  template:
    metadata:
      labels:
        app: cubepod-controller
    spec:
      serviceAccountName: cubepod-admin
      imagePullSecrets:
        - name: regcred
        - name: hub.sensedeal.vip
      containers:
        - name: controller
          image: hub.sensedeal.vip/library/cubepod-controller:v0.3.1-k8s
          imagePullPolicy: IfNotPresent
          args:
            - "-namespace=cubepod-workloads"
            - "-addr=:8081"
            - "-volume-mode=Block"
            - "-storage-class=cubepod-lvm-block"
            - "-runtime-class=none"
            - "-podd-image=hub.sensedeal.vip/library/cubepod-podd:v0.3.1-k8s"
            - "-sandbox-image=hub.sensedeal.vip/library/cubeplex-sandbox:0.8.0-260917"
          ports:
            - containerPort: 8081
              name: metrics
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: cubepod-controller
  namespace: cubepod-system
  labels:
    app: cubepod-controller
spec:
  selector:
    app: cubepod-controller
  ports:
    - port: 8081
      targetPort: 8081
      name: metrics

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubepod-gateway
  namespace: cubepod-system
  labels:
    app: cubepod-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cubepod-gateway
  template:
    metadata:
      labels:
        app: cubepod-gateway
    spec:
      serviceAccountName: cubepod-admin
      imagePullSecrets:
        - name: regcred
        - name: hub.sensedeal.vip
      containers:
        - name: gateway
          image: hub.sensedeal.vip/library/cubepod-gateway:v0.3.1-k8s
          imagePullPolicy: IfNotPresent
          args:
            - "-addr=:8080"
            - "-namespace=cubepod-workloads"
            - "-volume-mode=Block"
            - "-storage-class=cubepod-lvm-block"
            - "-runtime-class=none"
            - "-podd-image=hub.sensedeal.vip/library/cubepod-podd:v0.3.1-k8s"
            - "-sandbox-image=hub.sensedeal.vip/library/cubeplex-sandbox:0.8.0-260917"
            - "-live-pod-routing=true"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: cubepod-gateway
  namespace: cubepod-system
  labels:
    app: cubepod-gateway
spec:
  type: NodePort
  selector:
    app: cubepod-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32380
      name: http
