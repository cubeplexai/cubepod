# Prometheus Operator alerting rules for CubePod filesystem watchers and the
# E2B secret store. Apply with: kubectl apply -f deploy/monitoring/watcher-secret-alerts.yaml
# Added in v0.7.0.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cubepod-watcher-secret-alerts
  labels:
    app.kubernetes.io/name: cubepod
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: cubepod.secrets
      rules:
        - alert: CubePodSecretStoreHighErrorRate
          expr: |
            sum(rate(cubepod_secrets_operations_total{status="error"}[5m]))
              /
            clamp_min(sum(rate(cubepod_secrets_operations_total[5m])), 1e-9) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CubePod secret store error rate above 5%"
            description: "More than 5% of E2B secret store operations failed over the last 5 minutes."
        - alert: CubePodSecretStoreHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le, operation) (rate(cubepod_secrets_operation_duration_seconds_bucket[5m]))
            ) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CubePod secret store p99 latency above 0.5s"
            description: "p99 latency of secret store operation {{ $labels.operation }} exceeds 0.5s."
        - alert: CubePodSecretExchangeErrors
          expr: |
            sum(rate(cubepod_egress_secret_exchanges_total{result=~"error|denied"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CubePod egress cpodref_ secret exchanges are failing"
            description: "The egress proxy is reporting denied or errored cpodref_ secret exchanges."
    - name: cubepod.watchers
      rules:
        - alert: CubePodWatchOverflowDetected
          expr: |
            sum(increase(cubepod_watch_overflows_total[10m])) > 0
              or
            sum(increase(cubepod_podd_watch_overflows_total[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "CubePod filesystem watch overflow detected"
            description: "A watcher hit an inotify queue, ring buffer, or subscriber queue overflow and clients received resource_exhausted."
