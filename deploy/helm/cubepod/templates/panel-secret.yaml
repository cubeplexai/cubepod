{{- if not .Values.gateway.existingPanelSecret -}}
{{- $secretName := include "cubepod.panelSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $value := "" -}}
{{- if .Values.gateway.panelSecret -}}
{{- $value = .Values.gateway.panelSecret | toString | b64enc -}}
{{- else if and $existing (index $existing.data "panel-secret") -}}
{{- $value = index $existing.data "panel-secret" -}}
{{- else -}}
{{- $value = randAlphaNum 64 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
data:
  panel-secret: {{ $value }}
{{- end }}
