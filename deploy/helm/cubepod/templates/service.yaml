apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubepod.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cubepod.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
