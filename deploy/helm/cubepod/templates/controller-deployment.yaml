apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubepod.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  {{- if .Values.templateBuild.enabled }}
  replicas: 1
  {{- else }}
  replicas: {{ .Values.controller.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cubepod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "cubepod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "cubepod.serviceAccountName" . }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.registry }}/{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - "--addr=:{{ .Values.controller.healthzPort }}"
            - "--namespace={{ .Values.controller.workloadNamespace }}"
            - "--sync-interval={{ .Values.controller.syncInterval }}"
            {{- if .Values.controller.kubeApi }}
            - "--kube-api={{ .Values.controller.kubeApi }}"
            {{- end }}
            {{- if .Values.controller.kubeToken }}
            - "--kube-token={{ .Values.controller.kubeToken }}"
            {{- end }}
            {{- if .Values.featureGates.e2bTemplateAPI }}
            - "--e2b-template-api=true"
            {{- end }}
            {{- if .Values.templateBuild.enabled }}
            - "--template-build=true"
            - "--buildkit-addr={{ .Values.templateBuild.buildkit.address }}"
            - "--state-dir=/var/lib/cubepod/context"
            {{- if .Values.templateBuild.registry.url }}
            - "--template-registry={{ .Values.templateBuild.registry.url }}"
            {{- end }}
            {{- if .Values.templateBuild.registry.repositoryPrefix }}
            - "--template-repo-prefix={{ .Values.templateBuild.registry.repositoryPrefix }}"
            {{- end }}
            {{- if .Values.templateBuild.registry.pushSecret }}
            - "--template-push-secret={{ .Values.templateBuild.registry.pushSecret }}"
            {{- end }}
            {{- if .Values.templateBuild.registry.pullSecret }}
            - "--template-pull-secret={{ .Values.templateBuild.registry.pullSecret }}"
            {{- end }}
            {{- if .Values.templateBuild.probeTimeout }}
            - "--template-probe-timeout={{ .Values.templateBuild.probeTimeout }}"
            {{- end }}
            {{- end }}
          ports:
            - name: healthz
              containerPort: {{ .Values.controller.healthzPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if .Values.templateBuild.enabled }}
          volumeMounts:
            - name: context-storage
              mountPath: /var/lib/cubepod/context
          {{- end }}
      {{- if .Values.templateBuild.enabled }}
      volumes:
        - name: context-storage
          persistentVolumeClaim:
            claimName: cubepod-template-context
      {{- end }}
