{{- $ctxBackend := include "cubepod.contextStoreBackend" . }}
{{- $bkTLSSecret := include "cubepod.buildkitTLSSecretName" . }}
{{- $s3Env := include "cubepod.s3ContextEnv" . }}
{{- $needsLocalContextPVC := and .Values.templateBuild.enabled (ne $ctxBackend "s3") }}
{{- $needsBuildkitTLS := and .Values.templateBuild.enabled (ne $bkTLSSecret "") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubepod.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  {{- if $needsLocalContextPVC }}
  replicas: 1
  {{- else }}
  replicas: {{ .Values.controller.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cubepod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "cubepod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "cubepod.serviceAccountName" . }}
      {{- include "cubepod.podImagePullSecrets" . | nindent 6 }}
      {{- $pullSecretsCSV := include "cubepod.imagePullSecretsCSV" . }}
      {{- $tplPullSecret := include "cubepod.effectiveTemplatePullSecret" . }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.registry }}/{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - "--addr=:{{ .Values.controller.healthzPort }}"
            - "--namespace={{ .Values.controller.workloadNamespace }}"
            - "--sync-interval={{ .Values.controller.syncInterval }}"
            - "--storage-class={{ .Values.storage.storageClassName }}"
            - "--volume-mode={{ .Values.storage.volumeMode }}"
            - "--runtime-class={{ .Values.runtime.runtimeClassName }}"
            - "--podd-image={{ .Values.runtime.poddInjectorImage }}"
            - "--podd-injection-mode={{ .Values.runtime.poddInjectionMode | default "initContainer" }}"
            - "--podd-host-path={{ .Values.runtime.poddHostPath | default "/var/lib/cubepod/bin/active" }}"
            - "--sandbox-image={{ .Values.runtime.defaultSandboxImage }}"
            - "--default-egress-enabled={{ .Values.egress.enabled }}"
            - "--egress-image={{ include "cubepod.egressImage" . }}"
            {{- if .Values.egress.exchangeUrl }}
            - "--egress-exchange-url={{ .Values.egress.exchangeUrl }}"
            {{- end }}
            {{- if $pullSecretsCSV }}
            - "--image-pull-secrets={{ $pullSecretsCSV }}"
            {{- end }}
            {{- if $tplPullSecret }}
            - "--template-pull-secret={{ $tplPullSecret }}"
            {{- end }}
            {{- if .Values.controller.kubeApi }}
            - "--kube-api={{ .Values.controller.kubeApi }}"
            {{- end }}
            {{- if .Values.controller.kubeToken }}
            - "--kube-token={{ .Values.controller.kubeToken }}"
            {{- end }}
            {{- $fg := .Values.featureGates | default dict }}
            - "--e2b-template-api={{ include "cubepod.boolDefaultTrue" $fg.e2bTemplateAPI }}"
            {{- $nfs := ((.Values.volumes).nfs | default dict) }}
            - "--feature-gate={{ include "cubepod.featureGatesCSV" . }}"
            - "--volume-nfs-service={{ include "cubepod.fullname" . }}-volume-nfs"
            - "--volume-nfs-namespace={{ .Release.Namespace }}"
            - "--volume-nfs-lease-url=http://{{ include "cubepod.fullname" . }}-volume-nfs.{{ .Release.Namespace }}.svc:{{ default 8080 $nfs.leasePort }}"
            - "--volume-nfs-port={{ default 2049 $nfs.port }}"
            {{- if .Values.templateBuild.enabled }}
            - "--template-build=true"
            - "--buildkit-addr={{ include "cubepod.buildkitEffectiveAddress" . }}"
            - "--context-store-backend={{ $ctxBackend }}"
            {{- if eq $ctxBackend "s3" }}
            {{- $s3 := .Values.templateBuild.contextStore.s3 | default dict }}
            {{- if $s3.endpoint }}
            - "--s3-endpoint={{ $s3.endpoint }}"
            {{- end }}
            {{- if $s3.bucket }}
            - "--s3-bucket={{ $s3.bucket }}"
            {{- end }}
            - "--s3-region={{ default "us-east-1" $s3.region }}"
            {{- if $s3.prefix }}
            - "--s3-prefix={{ $s3.prefix }}"
            {{- end }}
            - "--s3-force-path-style={{ default false $s3.forcePathStyle }}"
            {{- else }}
            - "--state-dir=/var/lib/cubepod/context"
            {{- end }}
            {{- if $needsBuildkitTLS }}
            - "--buildkit-ca-cert=/etc/cubepod-buildkit-tls/ca.crt"
            - "--buildkit-tls-cert=/etc/cubepod-buildkit-tls/tls.crt"
            - "--buildkit-tls-key=/etc/cubepod-buildkit-tls/tls.key"
            {{- if .Values.templateBuild.buildkit.tls.serverName }}
            - "--buildkit-tls-server-name={{ .Values.templateBuild.buildkit.tls.serverName }}"
            {{- end }}
            {{- end }}
            {{- if .Values.templateBuild.registry.url }}
            - "--template-registry={{ .Values.templateBuild.registry.url }}"
            {{- end }}
            {{- if .Values.templateBuild.registry.repositoryPrefix }}
            - "--template-repo-prefix={{ .Values.templateBuild.registry.repositoryPrefix }}"
            {{- end }}
            {{- if .Values.templateBuild.registry.pushSecret }}
            - "--template-push-secret={{ .Values.templateBuild.registry.pushSecret }}"
            {{- end }}
            {{- if .Values.templateBuild.probeTimeout }}
            - "--template-probe-timeout={{ .Values.templateBuild.probeTimeout }}"
            {{- end }}
            {{- end }}
          {{- if or $s3Env .Values.egress.caSecretName }}
          env:
            {{- if $s3Env }}
            {{- $s3Env | nindent 12 }}
            {{- end }}
            {{- if .Values.egress.caSecretName }}
            {{- include "cubepod.egressCAEnv" . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: healthz
              containerPort: {{ .Values.controller.healthzPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if or $needsLocalContextPVC $needsBuildkitTLS .Values.egress.caSecretName }}
          volumeMounts:
            {{- if $needsLocalContextPVC }}
            - name: context-storage
              mountPath: /var/lib/cubepod/context
            {{- end }}
            {{- if $needsBuildkitTLS }}
            - name: buildkit-tls
              mountPath: /etc/cubepod-buildkit-tls
              readOnly: true
            {{- end }}
            {{- include "cubepod.egressCAVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if or $needsLocalContextPVC $needsBuildkitTLS .Values.egress.caSecretName }}
      volumes:
        {{- if $needsLocalContextPVC }}
        - name: context-storage
          persistentVolumeClaim:
            claimName: cubepod-template-context
        {{- end }}
        {{- if $needsBuildkitTLS }}
        - name: buildkit-tls
          secret:
            secretName: {{ $bkTLSSecret | quote }}
        {{- end }}
        {{- include "cubepod.egressCAVolume" . | nindent 8 }}
      {{- end }}
