apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubepod.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "cubepod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "cubepod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "cubepod.serviceAccountName" . }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.registry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args:
            - "--addr=:{{ .Values.gateway.port }}"
            - "--namespace={{ .Values.controller.workloadNamespace }}"
            - "--e2b-template-api={{ .Values.featureGates.e2bTemplateAPI }}"
            - "--template-build={{ .Values.templateBuild.enabled }}"
            - "--template-probe-timeout={{ .Values.templateBuild.probeTimeout }}"
            - "--controller-url=http://{{ include "cubepod.fullname" . }}-controller:{{ .Values.controller.healthzPort }}"
          env:
            {{- if .Values.gateway.panelSecret }}
            - name: CUBEPOD_PANEL_SECRET
              value: {{ .Values.gateway.panelSecret | quote }}
            {{- end }}
            {{- if .Values.e2bVolumes.enabled }}
            - name: CUBEPOD_E2B_VOLUME_DIR
              value: "/var/lib/cubepod/e2b-volumes"
            - name: CUBEPOD_K8S_E2B_VOLUME_MOUNTS
              value: "1"
            - name: CUBEPOD_E2B_SHARED_PVC
              value: {{ .Values.e2bVolumes.pvcName | quote }}
            {{- end }}
          {{- if .Values.e2bVolumes.enabled }}
          volumeMounts:
            - name: e2b-volumes
              mountPath: /var/lib/cubepod/e2b-volumes
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- if .Values.e2bVolumes.enabled }}
      volumes:
        - name: e2b-volumes
          persistentVolumeClaim:
            claimName: {{ .Values.e2bVolumes.pvcName }}
      {{- end }}
