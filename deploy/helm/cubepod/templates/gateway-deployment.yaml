apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubepod.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "cubepod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "cubepod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.registry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args:
            - "--addr=:{{ .Values.gateway.port }}"
            - "--e2b-template-api={{ .Values.featureGates.e2bTemplateAPI }}"
            - "--template-build={{ .Values.templateBuild.enabled }}"
            {{- if .Values.templateBuild.enabled }}
            - "--buildkit-addr={{ .Values.templateBuild.buildkit.address }}"
            {{- end }}
          env:
            {{- if .Values.gateway.panelSecret }}
            - name: CUBEPOD_PANEL_SECRET
              value: {{ .Values.gateway.panelSecret | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
