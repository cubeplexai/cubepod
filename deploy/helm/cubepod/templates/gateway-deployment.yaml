apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cubepod.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "cubepod.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "cubepod.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "cubepod.serviceAccountName" . }}
      {{- include "cubepod.podImagePullSecrets" . | nindent 6 }}
      {{- $pullSecretsCSV := include "cubepod.imagePullSecretsCSV" . }}
      {{- $tplPullSecret := include "cubepod.effectiveTemplatePullSecret" . }}
      {{- $stateDir := include "cubepod.effectiveGatewayStateDir" . }}
      {{- $e2bVolumesActive := eq (include "cubepod.e2bVolumesActive" .) "true" }}
      {{- $k8sE2BMounts := eq (include "cubepod.k8sE2BVolumeMountsEnabled" .) "true" }}
      {{- $secretsCfg := .Values.secrets | default dict }}
      {{- $fg := .Values.featureGates | default dict }}
      {{- $secretsEnabled := and (eq (include "cubepod.boolDefaultTrue" $secretsCfg.enabled) "true") (eq (include "cubepod.boolDefaultTrue" $fg.e2bSecretsAPI) "true") }}
      {{- $secretsBackend := default "k8s" $secretsCfg.backend }}
      {{- $secretsKeySecret := include "cubepod.secretsKeySecretName" . }}
      {{- $eventsCfg := .Values.events | default dict }}
      {{- $eventsBackend := default "k8s" $eventsCfg.backend }}
      {{- $eventsEnabled := and (eq (include "cubepod.boolDefaultTrue" $eventsCfg.enabled) "true") (eq (include "cubepod.boolDefaultTrue" $fg.sandboxEventsAndWebhooks) "true") (ne $eventsBackend "disabled") }}
      {{- $ctxBackend := include "cubepod.contextStoreBackend" . }}
      {{- $s3Env := include "cubepod.s3ContextEnv" . }}
      {{- $hasEnv := true }}
      {{- $hasVolumes := or $e2bVolumesActive .Values.egress.caSecretName .Values.gateway.persistence.enabled }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.registry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          args:
            - "--addr=:{{ .Values.gateway.port }}"
            - "--namespace={{ .Values.controller.workloadNamespace }}"
            - "--storage-class={{ .Values.storage.storageClassName }}"
            - "--volume-mode={{ .Values.storage.volumeMode }}"
            - "--runtime-class={{ .Values.runtime.runtimeClassName }}"
            - "--podd-image={{ .Values.runtime.poddInjectorImage }}"
            - "--sandbox-image={{ .Values.runtime.defaultSandboxImage }}"
            - "--egress-image={{ include "cubepod.egressImage" . }}"
            - "--live-pod-routing={{ .Values.gateway.livePodRouting }}"
            {{- if $pullSecretsCSV }}
            - "--image-pull-secrets={{ $pullSecretsCSV }}"
            {{- end }}
            {{- if $tplPullSecret }}
            - "--template-pull-secret={{ $tplPullSecret }}"
            {{- end }}
            - "--e2b-template-api={{ include "cubepod.boolDefaultTrue" $fg.e2bTemplateAPI }}"
            - "--feature-gate={{ include "cubepod.featureGatesCSV" . }}"
            - "--metrics-sample-interval={{ .Values.gateway.metricsSampleInterval | default "10s" }}"
            - "--template-build={{ .Values.templateBuild.enabled }}"
            - "--template-probe-timeout={{ .Values.templateBuild.probeTimeout }}"
            - "--controller-url=http://{{ include "cubepod.fullname" . }}-controller:{{ .Values.controller.healthzPort }}"
            {{- if and .Values.templateBuild.enabled (eq $ctxBackend "s3") }}
            - "--context-store-backend=s3"
            {{- $s3 := .Values.templateBuild.contextStore.s3 | default dict }}
            {{- if $s3.endpoint }}
            - "--s3-endpoint={{ $s3.endpoint }}"
            {{- end }}
            {{- if $s3.bucket }}
            - "--s3-bucket={{ $s3.bucket }}"
            {{- end }}
            - "--s3-region={{ default "us-east-1" $s3.region }}"
            {{- if $s3.prefix }}
            - "--s3-prefix={{ $s3.prefix }}"
            {{- end }}
            - "--s3-force-path-style={{ default false $s3.forcePathStyle }}"
            {{- end }}
            {{- if $stateDir }}
            - "--state-dir={{ $stateDir }}"
            {{- end }}
          {{- if $hasEnv }}
          env:
            {{- if .Values.gateway.panelSecret }}
            - name: CUBEPOD_PANEL_SECRET
              value: {{ .Values.gateway.panelSecret | quote }}
            {{- end }}
            {{- if $stateDir }}
            - name: CUBEPOD_STATE
              value: {{ $stateDir | quote }}
            {{- end }}
            {{- if .Values.gateway.webhookAllowPrivate }}
            - name: CUBEPOD_WEBHOOK_ALLOW_PRIVATE
              value: "1"
            {{- end }}
            {{- if not $secretsEnabled }}
            - name: CUBEPOD_SECRETS_BACKEND
              value: "disabled"
            - name: CUBEPOD_SECRETS_DIR
              value: "disabled"
            {{- else }}
            - name: CUBEPOD_SECRETS_BACKEND
              value: {{ $secretsBackend | quote }}
            {{- if and (eq $secretsBackend "file") $secretsCfg.dir }}
            - name: CUBEPOD_SECRETS_DIR
              value: {{ $secretsCfg.dir | quote }}
            {{- end }}
            {{- if and (eq $secretsBackend "file") $secretsKeySecret }}
            - name: CUBEPOD_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretsKeySecret | quote }}
                  key: key
            {{- end }}
            {{- end }}
            {{- if not $eventsEnabled }}
            - name: CUBEPOD_EVENTS_BACKEND
              value: "disabled"
            - name: CUBEPOD_EVENTS_DIR
              value: "disabled"
            {{- else }}
            - name: CUBEPOD_EVENTS_BACKEND
              value: {{ $eventsBackend | quote }}
            {{- if and (eq $eventsBackend "file") $eventsCfg.dir }}
            - name: CUBEPOD_EVENTS_DIR
              value: {{ $eventsCfg.dir | quote }}
            {{- end }}
            {{- if and (eq $eventsBackend "file") .Values.gateway.eventsKeySecret }}
            - name: CUBEPOD_EVENTS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.eventsKeySecret | quote }}
                  key: key
            {{- end }}
            {{- end }}
            {{- if $e2bVolumesActive }}
            - name: CUBEPOD_E2B_VOLUME_DIR
              value: "/var/lib/cubepod/e2b-volumes"
            - name: CUBEPOD_K8S_E2B_VOLUME_MOUNTS
              value: {{ ternary "1" "0" $k8sE2BMounts | quote }}
            - name: CUBEPOD_E2B_SHARED_PVC
              value: {{ .Values.e2bVolumes.pvcName | quote }}
            {{- end }}
            {{- if $s3Env }}
            {{- $s3Env | nindent 12 }}
            {{- end }}
            {{- include "cubepod.egressCAEnv" . | nindent 12 }}
          {{- end }}
          {{- if $hasVolumes }}
          volumeMounts:
            {{- if .Values.gateway.persistence.enabled }}
            - name: gateway-state
              mountPath: {{ $stateDir | quote }}
            {{- end }}
            {{- if $e2bVolumesActive }}
            - name: e2b-volumes
              mountPath: /var/lib/cubepod/e2b-volumes
            {{- end }}
            {{- include "cubepod.egressCAVolumeMount" . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- if $hasVolumes }}
      volumes:
        {{- if .Values.gateway.persistence.enabled }}
        - name: gateway-state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-gateway-state" (include "cubepod.fullname" .)) .Values.gateway.persistence.existingClaim | quote }}
        {{- end }}
        {{- if $e2bVolumesActive }}
        - name: e2b-volumes
          persistentVolumeClaim:
            claimName: {{ .Values.e2bVolumes.pvcName | quote }}
        {{- end }}
        {{- include "cubepod.egressCAVolume" . | nindent 8 }}
      {{- end }}
