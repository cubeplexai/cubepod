apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cubepod.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cubepod.fullname" . }}-controller
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - persistentvolumeclaims
      - events
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cubepod.io", "pod.cubeplex.ai"]
    resources:
      - podboxes
      - podboxes/status
      - podtemplates
      - podtemplates/status
      - podwarmpools
      - podwarmpools/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cubepod.fullname" . }}-controller
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cubepod.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "cubepod.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
