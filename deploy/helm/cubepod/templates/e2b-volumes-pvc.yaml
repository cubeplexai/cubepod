{{- if .Values.e2bVolumes.rwxStorageClassName }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.e2bVolumes.pvcName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2b-volumes
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.e2bVolumes.rwxStorageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.e2bVolumes.size | quote }}
{{- end }}
