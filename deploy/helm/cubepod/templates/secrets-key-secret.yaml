{{- $secrets := .Values.secrets | default dict -}}
{{- $fg := .Values.featureGates | default dict -}}
{{- $secretsEnabled := and (eq (include "cubepod.boolDefaultTrue" $secrets.enabled) "true") (eq (include "cubepod.boolDefaultTrue" $fg.e2bSecretsAPI) "true") -}}
{{- if and $secretsEnabled (eq (default "k8s" $secrets.backend) "file") $secrets.encryptionKey (not $secrets.existingSecret) (not .Values.gateway.secretsKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cubepod.fullname" . }}-secrets-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  key: {{ $secrets.encryptionKey | quote }}
{{- end }}
