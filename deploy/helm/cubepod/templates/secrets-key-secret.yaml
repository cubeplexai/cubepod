{{- $secrets := .Values.secrets | default dict -}}
{{- if and (default true $secrets.enabled) $secrets.encryptionKey (not $secrets.existingSecret) (not .Values.gateway.secretsKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cubepod.fullname" . }}-secrets-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cubepod.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  key: {{ $secrets.encryptionKey | quote }}
{{- end }}
