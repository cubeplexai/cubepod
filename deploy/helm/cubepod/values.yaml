global:
  imageRegistry: "ghcr.io"
  repository: "cubeplexai"
  # Optional list of Kubernetes imagePullSecrets attached to control-plane and sandbox Pods
  imagePullSecrets: []

runtime:
  runtimeClassName: "kata-qemu"
  defaultTemplate: "cubeplex-ubuntu24-desktop"
  # Lightweight initContainer image that injects /opt/cubepod/bin/{podd-init,podd} at Pod startup
  poddInjectorImage: "ghcr.io/cubeplexai/cubepod-podd:v0.6.0"
  # Default workload sandbox image (clean OS/tooling image without podd baked in)
  defaultSandboxImage: "ghcr.io/cubeplexai/cubeplex-sandbox:v0.4.0"
  # Optional single imagePullSecret name attached to sandbox Pods (when templateBuild.registry.pullSecret is unset)
  templatePullSecret: ""

storage:
  # SPDK NVMe-oF Raw Block StorageClass (Longhorn V2 or OpenEBS Mayastor) or Filesystem
  storageClassName: "longhorn-v2-block-thin"
  volumeMode: "Block" # "Block" or "Filesystem"
  rootfsSize: "10Gi"
  workspaceSize: "20Gi"

warmPool:
  enabled: true
  replicas: 3

gateway:
  replicaCount: 2
  podDisruptionBudget:
    # When null/omitted, enabled automatically when gateway.replicaCount > 1.
    enabled: null
    minAvailable: null
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-gateway"
    tag: "v0.6.0"
    pullPolicy: "IfNotPresent"
  port: 8080
  livePodRouting: true
  # Optional state directory for local templates, secrets, and events (defaults to /var/lib/cubepod/state when persistence is enabled)
  stateDir: ""
  webhookAllowPrivate: false
  # Background sandbox metrics sampling interval (Go duration; "0" disables). Added in v0.7.0.
  metricsSampleInterval: "10s"
  # Optional Kubernetes Secrets holding 32-byte base64/64-hex keys (secret key: "key")
  secretsKeySecret: ""
  eventsKeySecret: ""
  persistence:
    # Note: with ReadWriteOnce storage, set gateway.replicaCount=1
    enabled: false
    existingClaim: ""
    storageClassName: ""
    size: "10Gi"
    accessMode: "ReadWriteOnce"
  service:
    type: "ClusterIP"
    port: 8080
    nodePort: null
  panelSecret: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

controller:
  replicaCount: 1
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-controller"
    tag: "v0.6.0"
    pullPolicy: "IfNotPresent"
  healthzPort: 8081
  workloadNamespace: "cubepod-workloads"
  syncInterval: "5s"
  kubeApi: ""
  kubeToken: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

egress:
  enabled: true
  transparent: true
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-egress"
    tag: "v0.6.0"
  port: 18080
  exchangeUrl: "https://cubeplex-backend.cubeplex.svc:8443/api/v1/internal/egress/exchange"
  # Optional existing Secret in the release namespace containing ca.crt and ca.key for egress mTLS
  caSecretName: ""
  # Mount ca.crt as CUBEPOD_EGRESS_UPSTREAM_CA_FILE into egress sidecars
  upstreamCAEnabled: false

secrets:
  enabled: true
  # Backend for /secrets: "k8s" (multi-replica HA via Kubernetes Secrets), "file", or "disabled"
  backend: "k8s"
  # Directory used when secrets.backend is "file"
  dir: "/var/lib/cubepod/secrets"
  # Existing Kubernetes Secret containing 32-byte base64/64-hex key under data.key (overrides gateway.secretsKeySecret)
  existingSecret: ""
  # Optional inline 32-byte base64/64-hex key; when set without existingSecret, creates a release Secret
  encryptionKey: ""

featureGates:
  # Default on (GA in v0.7.0); set false to roll back GET /templates to the legacy {"templates":[...]} wrapper
  e2bTemplateAPI: true
  transparentEgress: true
  desktopStack: true
  statelessGatewayHA: true
  e2bFilesystemWatch: true
  e2bSecretsAPI: true
  sandboxEventsAndWebhooks: true
  k8sE2BVolumeMounts: false

templateBuild:
  enabled: false
  contextStore:
    # Context archive and log backend: "local" (single-replica RWO PVC) or "s3" (shared object storage for HA controller replicas)
    backend: "local"
    s3:
      endpoint: ""
      bucket: ""
      region: "us-east-1"
      prefix: ""
      forcePathStyle: false
      # Existing Kubernetes Secret containing accessKeyId, secretAccessKey, and optional sessionToken keys
      credentialsSecretName: ""
  buildkit:
    replicaCount: 1
    image: "moby/buildkit:rootless"
    address: "tcp://cubepod-buildkit.cubepod-system.svc:1234"
    nodeSelector: {}
    tls:
      enabled: false
      # Existing Kubernetes Secret containing ca.crt, tls.crt, and tls.key for BuildKit mTLS (:1234)
      secretName: ""
      serverName: "cubepod-buildkit"
  cacheSize: "20Gi"
  probeTimeout: "120s"
  registry:
    url: ""
    pushSecret: "cubepod-buildkit-push"
    pullSecret: "cubepod-buildkit-pull"
    repositoryPrefix: "cubepod-templates"

e2bVolumes:
  enabled: false
  pvcName: "cubepod-e2b-volumes"
  rwxStorageClassName: ""
  size: "20Gi"
