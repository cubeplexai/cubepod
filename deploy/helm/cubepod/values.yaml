global:
  imageRegistry: "ghcr.io"
  repository: "cubeplexai"
  # Optional list of Kubernetes imagePullSecrets attached to control-plane and sandbox Pods
  imagePullSecrets: []

runtime:
  runtimeClassName: "kata-qemu"
  defaultTemplate: "cubeplex-ubuntu24-desktop"
  # Lightweight initContainer image that injects /opt/cubepod/bin/{podd-init,podd} at Pod startup
  poddInjectorImage: "ghcr.io/cubeplexai/cubepod-podd:v0.8.0"
  # Default workload sandbox image (clean OS/tooling image without podd baked in)
  defaultSandboxImage: "ghcr.io/cubeplexai/cubeplex-sandbox:v0.4.0"
  # Optional single imagePullSecret name attached to sandbox Pods (when templateBuild.registry.pullSecret is unset)
  templatePullSecret: ""

storage:
  # SPDK NVMe-oF Raw Block StorageClass (Longhorn V2 or OpenEBS Mayastor) or Filesystem
  storageClassName: "longhorn-v2-block-thin"
  volumeMode: "Block" # "Block" or "Filesystem"
  rootfsSize: "10Gi"
  workspaceSize: "20Gi"

warmPool:
  enabled: true
  replicas: 3

gateway:
  replicaCount: 2
  podDisruptionBudget:
    # When null/omitted, enabled automatically when gateway.replicaCount > 1.
    enabled: null
    minAvailable: null
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-gateway"
    tag: "v0.8.0"
    pullPolicy: "IfNotPresent"
  port: 8080
  livePodRouting: true
  # Optional state directory for local templates, secrets, and events (defaults to /var/lib/cubepod/state when persistence is enabled)
  stateDir: ""
  webhookAllowPrivate: false
  # Background sandbox metrics sampling interval (Go duration; "0" disables). Added in v0.7.0.
  metricsSampleInterval: "10s"
  # Optional Kubernetes Secrets holding 32-byte base64/64-hex keys (secret key: "key")
  secretsKeySecret: ""
  eventsKeySecret: ""
  persistence:
    # Note: with ReadWriteOnce storage, set gateway.replicaCount=1
    enabled: false
    existingClaim: ""
    storageClassName: ""
    size: "10Gi"
    accessMode: "ReadWriteOnce"
  service:
    type: "ClusterIP"
    port: 8080
    nodePort: null
  # HMAC secret used to sign /panel/{token}/ URLs. Required at gateway startup.
  # When empty, the chart generates a random Secret on install and reuses it
  # on upgrade. Do not rotate an in-use secret or existing panel tokens and
  # multi-replica verification will break. Set this to supply your own value.
  # Changed in v0.7.0.
  panelSecret: ""
  # Existing operator-managed Secret (key: panel-secret). Takes precedence over
  # panelSecret and skips Secret generation; recommended for GitOps/ExternalSecrets.
  existingPanelSecret: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

controller:
  replicaCount: 1
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-controller"
    tag: "v0.8.0"
    pullPolicy: "IfNotPresent"
  healthzPort: 8081
  workloadNamespace: "cubepod-workloads"
  syncInterval: "5s"
  kubeApi: ""
  kubeToken: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

egress:
  enabled: true
  transparent: true
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-egress"
    tag: "v0.8.0"
  port: 18080
  exchangeUrl: "https://cubeplex-backend.cubeplex.svc:8443/api/v1/internal/egress/exchange"
  # Optional existing Secret in the release namespace containing ca.crt and ca.key for egress mTLS
  caSecretName: ""
  # Mount ca.crt as CUBEPOD_EGRESS_UPSTREAM_CA_FILE into egress sidecars
  upstreamCAEnabled: false

secrets:
  enabled: true
  # Backend for /secrets: "k8s" (multi-replica HA via Kubernetes Secrets), "file", or "disabled"
  backend: "k8s"
  # Directory used when secrets.backend is "file"
  dir: "/var/lib/cubepod/secrets"
  # Existing Kubernetes Secret containing 32-byte base64/64-hex key under data.key (overrides gateway.secretsKeySecret)
  existingSecret: ""
  # Optional inline 32-byte base64/64-hex key; when set without existingSecret, creates a release Secret
  encryptionKey: ""

events:
  enabled: true
  # Backend for /events, /webhooks, and /webhooks/dead-letters: "k8s" (multi-replica HA via SandboxWebhook CRDs, Secrets, and PodBox Events), "file", or "disabled"
  backend: "k8s"
  # Directory used when events.backend is "file"
  dir: "/var/lib/cubepod/events"

featureGates:
  # Default on (GA in v0.7.0); set false to roll back GET /templates to the legacy {"templates":[...]} wrapper
  e2bTemplateAPI: true
  transparentEgress: true
  desktopStack: true
  statelessGatewayHA: true
  e2bFilesystemWatch: true
  e2bSecretsAPI: true
  sandboxEventsAndWebhooks: true
  blockWorkspaceVolumes: true
  k8sVolumeMounts: false
  # Firecracker official volume NFS transport (CEP-0031). Default on: the gate was
  # proven on real Kata Firecracker with both official SDKs. Kata FC guests need a
  # kernel with built-in NFSv3 (see deploy/k8s/kata/guest-kernel/fc-nfs1.pin.json).
  firecrackerVolumeNFS: true

templateBuild:
  enabled: false
  contextStore:
    # Context archive and log backend: "local" (single-replica RWO PVC) or "s3" (shared object storage for HA controller replicas)
    backend: "local"
    # Optional StorageClassName for cubepod-template-context PVC (when backend is "local")
    storageClassName: ""
    s3:
      endpoint: ""
      bucket: ""
      region: "us-east-1"
      prefix: ""
      forcePathStyle: false
      # Existing Kubernetes Secret containing accessKeyId, secretAccessKey, and optional sessionToken keys
      credentialsSecretName: ""
  buildkit:
    replicaCount: 1
    image: "moby/buildkit:rootless"
    address: "tcp://cubepod-buildkit.cubepod-system.svc:1234"
    nodeSelector: {}
    # Optional StorageClassName for cubepod-buildkit-cache PVC / StatefulSet volumeClaimTemplates (recommend block-backed ext4 such as longhorn over NFS)
    cacheStorageClassName: ""
    tls:
      enabled: false
      # Existing Kubernetes Secret containing ca.crt, tls.crt, and tls.key for BuildKit mTLS (:1234)
      secretName: ""
      serverName: "cubepod-buildkit"
  cacheSize: "20Gi"
  probeTimeout: "120s"
  registry:
    url: ""
    pushSecret: "cubepod-buildkit-push"
    pullSecret: "cubepod-buildkit-pull"
    repositoryPrefix: "cubepod-templates"

volumes:
  enabled: false
  pvcName: "cubepod-volumes"
  rwxStorageClassName: ""
  size: "20Gi"
  allowLazyLegacyClaim: true
  # In-cluster userspace NFSv3 proxy for official volumes on Kata Firecracker (CEP-0031).
  # Alpha is single-replica; a process restart may ESTALE active mounts. Added in v0.8.0.
  nfs:
    enabled: false
    image:
      registry: "ghcr.io"
      repository: "cubeplexai/cubepod-volume-nfs"
      tag: "v0.8.0"
      pullPolicy: "IfNotPresent"
    port: 2049
    leasePort: 8080
    # Alpha must remain 1: go-nfs filehandles are in-memory.
    replicaCount: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
