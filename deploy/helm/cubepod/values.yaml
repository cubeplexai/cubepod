global:
  imageRegistry: "ghcr.io"
  repository: "cubeplexai"
  # Optional list of Kubernetes imagePullSecrets attached to control-plane and sandbox Pods
  imagePullSecrets: []

runtime:
  runtimeClassName: "kata-qemu"
  defaultTemplate: "cubeplex-ubuntu24-desktop"
  # Lightweight initContainer image that injects /opt/cubepod/bin/{podd-init,podd} at Pod startup
  poddInjectorImage: "ghcr.io/cubeplexai/cubepod-podd:v0.5.1"
  # Default workload sandbox image (clean OS/tooling image without podd baked in)
  defaultSandboxImage: "ghcr.io/cubeplexai/cubeplex-sandbox:v0.4.0"
  # Optional single imagePullSecret name attached to sandbox Pods (when templateBuild.registry.pullSecret is unset)
  templatePullSecret: ""

storage:
  # SPDK NVMe-oF Raw Block StorageClass (Longhorn V2 or OpenEBS Mayastor) or Filesystem
  storageClassName: "longhorn-v2-block-thin"
  volumeMode: "Block" # "Block" or "Filesystem"
  rootfsSize: "10Gi"
  workspaceSize: "20Gi"

warmPool:
  enabled: true
  replicas: 3

gateway:
  replicaCount: 2
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-gateway"
    tag: "v0.5.1"
    pullPolicy: "IfNotPresent"
  port: 8080
  livePodRouting: true
  # Optional state directory for local templates, secrets, and events (defaults to /var/lib/cubepod/state when persistence is enabled)
  stateDir: ""
  webhookAllowPrivate: false
  # Optional Kubernetes Secrets holding 32-byte base64/64-hex keys (secret key: "key")
  secretsKeySecret: ""
  eventsKeySecret: ""
  persistence:
    # Note: with ReadWriteOnce storage, set gateway.replicaCount=1
    enabled: false
    existingClaim: ""
    storageClassName: ""
    size: "10Gi"
    accessMode: "ReadWriteOnce"
  service:
    type: "ClusterIP"
    port: 8080
    nodePort: null
  panelSecret: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

controller:
  replicaCount: 1
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-controller"
    tag: "v0.5.1"
    pullPolicy: "IfNotPresent"
  healthzPort: 8081
  workloadNamespace: "cubepod-workloads"
  syncInterval: "5s"
  kubeApi: ""
  kubeToken: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

egress:
  enabled: true
  image:
    registry: "ghcr.io"
    repository: "cubeplexai/cubepod-egress"
    tag: "v0.5.1"
  port: 18080
  exchangeUrl: "https://cubeplex-backend.cubeplex.svc:8443/api/v1/internal/egress/exchange"
  # Optional existing Secret in the release namespace containing ca.crt and ca.key for egress mTLS
  caSecretName: ""
  # Mount ca.crt as CUBEPOD_EGRESS_UPSTREAM_CA_FILE into egress sidecars
  upstreamCAEnabled: false

featureGates:
  # Turning on changes GET /templates from the wrapped stub to a JSON array
  e2bTemplateAPI: false

templateBuild:
  enabled: false
  buildkit:
    image: "moby/buildkit:rootless"
    address: "tcp://cubepod-buildkit.cubepod-system.svc:1234"
    nodeSelector: {}
  cacheSize: "20Gi"
  probeTimeout: "120s"
  registry:
    url: ""
    pushSecret: "cubepod-buildkit-push"
    pullSecret: "cubepod-buildkit-pull"
    repositoryPrefix: "cubepod-templates"

e2bVolumes:
  enabled: false
  pvcName: "cubepod-e2b-volumes"
  rwxStorageClassName: ""
  size: "20Gi"
