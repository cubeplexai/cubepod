apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxwebhooks.cubepod.io
spec:
  group: cubepod.io
  names:
    kind: SandboxWebhook
    listKind: SandboxWebhookList
    plural: sandboxwebhooks
    singular: sandboxwebhook
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantHash
                - name
                - url
                - events
                - secretName
              properties:
                tenantHash:
                  type: string
                name:
                  type: string
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
                secretName:
                  type: string
            status:
              type: object
              properties:
                lastDeliveryTime:
                  type: string
                  format: date-time
                consecutiveFailures:
                  type: integer
                deadLetters:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required:
                      - id
                      - eventId
                      - eventType
                      - reason
                    properties:
                      id:
                        type: string
                      eventId:
                        type: string
                      eventType:
                        type: string
                      sandboxId:
                        type: string
                      reason:
                        type: string
                        enum:
                          - delivery_failed
                          - queue_full
                      attempts:
                        type: integer
                      lastStatusCode:
                        type: integer
                      lastError:
                        type: string
                      retryCount:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      event:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
