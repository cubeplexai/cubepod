apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxwebhooks.cubepod.io
spec:
  group: cubepod.io
  names:
    kind: SandboxWebhook
    listKind: SandboxWebhookList
    plural: sandboxwebhooks
    singular: sandboxwebhook
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantHash
                - name
                - url
                - events
                - secretName
              properties:
                tenantHash:
                  type: string
                name:
                  type: string
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
                secretName:
                  type: string
            status:
              type: object
              properties:
                lastDeliveryTime:
                  type: string
                  format: date-time
                consecutiveFailures:
                  type: integer
