apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podtemplates.cubepod.io
  labels:
    app.kubernetes.io/name: cubepod
spec:
  group: cubepod.io
  names:
    plural: podtemplates
    singular: podtemplate
    kind: PodTemplate
    shortNames:
      - pt
      - ptemplate
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                runtimeClassName:
                  type: string
                image:
                  type: string
                poddImage:
                  type: string
                resources:
                  type: object
                  properties:
                    cpuRequest:
                      type: string
                    cpuLimit:
                      type: string
                    memoryRequest:
                      type: string
                    memoryLimit:
                      type: string
                storage:
                  type: object
                  properties:
                    storageClassName:
                      type: string
                    rootfsSize:
                      type: string
                    workspaceSize:
                      type: string
                egress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    image:
                      type: string
                    exchangeUrl:
                      type: string
                names:
                  type: array
                  items:
                    type: string
                cpuCount:
                  type: integer
                memoryMB:
                  type: integer
                diskSizeMB:
                  type: integer
                public:
                  type: boolean
                startCmd:
                  type: string
                readyCmd:
                  type: string
                runAsUser:
                  type: integer
                  format: int64
                runAsGroup:
                  type: integer
                  format: int64
                runAsUsername:
                  type: string
            status:
              type: object
              properties:
                templateID:
                  type: string
                readyBuildID:
                  type: string
                readyImage:
                  type: string
                latestBuildID:
                  type: string
                buildStatus:
                  type: string
                reason:
                  type: string
                public:
                  type: boolean
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .status.readyImage
        - name: Build
          type: string
          jsonPath: .status.buildStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
