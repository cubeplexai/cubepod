apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podwarmpools.cubepod.io
  labels:
    app.kubernetes.io/name: cubepod
spec:
  group: cubepod.io
  names:
    plural: podwarmpools
    singular: podwarmpool
    kind: PodWarmPool
    shortNames:
      - pwp
      - warmpool
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - templateRef
                - replicas
              properties:
                templateRef:
                  type: string
                replicas:
                  type: integer
                  minimum: 0
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                availableReplicas:
                  type: integer
      additionalPrinterColumns:
        - name: Desired
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
