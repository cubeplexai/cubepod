apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podboxes.cubepod.io
  labels:
    app.kubernetes.io/name: cubepod
spec:
  group: cubepod.io
  names:
    plural: podboxes
    singular: podbox
    kind: PodBox
    shortNames:
      - pb
      - pbox
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - desiredState
              properties:
                templateRef:
                  type: string
                warmPoolRef:
                  type: string
                desiredState:
                  type: string
                  enum:
                    - Running
                    - Paused
                rootfsGeneration:
                  type: integer
                forkFrom:
                  type: object
                  properties:
                    podBoxName:
                      type: string
                lifecycle:
                  type: object
                  properties:
                    idleTimeoutSeconds:
                      type: integer
                    pausedTTLSeconds:
                      type: integer
                    leaseExpiresAt:
                      type: string
                      format: date-time
                networkPolicy:
                  type: object
                  properties:
                    defaultAction:
                      type: string
                      enum:
                        - Allow
                        - Deny
                    allowHosts:
                      type: array
                      items:
                        type: string
                    denyHosts:
                      type: array
                      items:
                        type: string
                    upstreamProxy:
                      type: string
                    secretBindings:
                      type: array
                      items:
                        type: object
                        required:
                          - envName
                          - placeholder
                          - allowedHosts
                        properties:
                          envName:
                            type: string
                          placeholder:
                            type: string
                          allowedHosts:
                            type: array
                            items:
                              type: string
                          allowedHeaders:
                            type: array
                            items:
                              type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                podName:
                  type: string
                podIP:
                  type: string
                nodeName:
                  type: string
                rootfsPVCName:
                  type: string
                workspacePVCName:
                  type: string
                observedRootfsGeneration:
                  type: integer
                lastActivityAt:
                  type: string
                  format: date-time
                pausedAt:
                  type: string
                  format: date-time
                reason:
                  type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Desired
          type: string
          jsonPath: .spec.desiredState
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
